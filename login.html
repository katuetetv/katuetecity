<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KatueteCity — Acceso Ciudadano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pantalla-login-body">
  <div class="login-container-mini login-box-pagina">
    <div class="cabecera-modal-mini" style="justify-content: center;">
      <h3 style="font-size: 20px;">🏙️ KatueteCity</h3>
    </div>
    <p style="font-size: 13px; color: var(--cor-texto-dim); margin: -6px 0 16px 0;">Acceso Ciudadano y Municipal</p>

    <form id="form-login" autocomplete="on">
      <div class="campo-grupo">
        <input 
          type="email" 
          id="campo-email" 
          placeholder="Correo electrónico" 
          required 
          autofocus
        />
      </div>

      <div class="campo-grupo">
        <input 
          type="password" 
          id="campo-senha" 
          placeholder="Contraseña (mínimo 6 caracteres)" 
          minlength="6"
          required 
        />
      </div>

      <!-- BOTÓN CREAR CUENTA PRIMERO, LUEGO INICIAR SESIÓN -->
      <div class="botones-auth-apilados">
        <button type="button" class="btn-login-principal" id="btn-registrarse">Crear Cuenta</button>
        <button type="submit" class="btn-secundario-completo" id="btn-iniciar-sesion">Iniciar Sesión</button>
      </div>

      <div class="separador-auth">
        <span>O</span>
      </div>

      <button type="button" class="btn-google" id="btn-google">
        <svg class="google-icono" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuar con Google
      </button>

      <button type="button" class="btn-volver-visitante" id="btn-volver-juego">
        👀 Ver ciudad como Visitante (Solo Explorar)
      </button>

      <div id="msg-erro" class="msg-alerta"></div>
    </form>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
